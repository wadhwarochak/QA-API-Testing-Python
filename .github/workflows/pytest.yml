
name: Python API Automation Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: Execute Pytest API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute API Tests
        id: pytest
        continue-on-error: true
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/junit.xml

      - name: Generate HTML Email Report
        if: always()
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python generate_email_report.py

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v23
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}

          subject: "API Automation Report - ${{ steps.pytest.outcome }}"

          html_body: file://reports/email_report.html

      - name: Mark Workflow Failed if Tests Failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1
